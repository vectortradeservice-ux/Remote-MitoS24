name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CameraCast-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CameraCast.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "APK ที่บิลด์อัตโนมัติล่าสุด" --prerelease
          gh release upload latest CameraCast.apk --clobber
